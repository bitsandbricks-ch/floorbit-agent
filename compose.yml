# The local agent for a hosted Floorbit (README.md). Run it on the event network, next to
# LibreNMS and NetBox, not on the hosted server:
#
#   cp agent.env.example agent.env      # FLOORBIT_URL and FLOORBIT_AGENT_KEY
#   docker compose up -d
#
# It only connects out, over HTTPS: nothing has to be opened. Its plugins are set up in the hosted
# Floorbit (Settings > Plugins). Telegraf for device telemetry is in the image: nothing else to
# start. For the plugins that listen in the hall (syslog, flows, the check-in note, the front door),
# uncomment the matching ports below. Every port and how to check it: Floorbit's docs/agent.md, "Ports".
#
# Coming from a compose file with a telegraf service: delete it, then
#   docker compose up -d --remove-orphans

services:
  agent:
    image: ghcr.io/bitsandbricks-ch/floorbit-agent:${FLOORBIT_AGENT_VERSION:-latest}
    env_file:
      - path: agent.env
        required: true
    environment:
      # Its own small settings file; it keeps no floor plan.
      FLOORBIT_DATA_FILE: /app/state/agent-data.json
    volumes:
      - agent_state:/app/state
    ports:
      # /metrics and /healthz for Prometheus, on this machine only (README.md, "Monitor it").
      - "127.0.0.1:9520:9520"
      # Device telemetry: the agent runs Telegraf itself. SNMP traps and Cisco model-driven
      # telemetry (dial-out) from the devices. Another trap receiver on this machine already holds
      # 162 (LibreNMS's snmptrapd): set TRAP_PUBLISH_PORT and point the devices there.
      - "${TRAP_PUBLISH_PORT:-162}:1162/udp"
      - "${MDT_PUBLISH_PORT:-57000}:57000"
    # Syslog from the hall (plugin port 5514) and Traffic from the hall (NetFlow, 2055):
    #   - "514:5514/udp"
    #   - "2055:2055/udp"
    # A firewall's own Telegraf (OPNsense os-telegraf, pfSense) sending to the agent's telemetry listener:
    #   - "8186:8186"
    # Check-in note on phones (address 0.0.0.0:8908), for the event's HTTPS reverse proxy:
    #   - "8908:8908"
    # Front door for attendees (address 0.0.0.0:8443): check-in and the seat speed test:
    #   - "443:8443"
    # A refused key (revoked or wrong) stops the agent with exit code 1: don't restart it into
    # the same refusal every few seconds. Network trouble doesn't stop it; it retries by itself.
    restart: on-failure:3
    # Whether the hosted Floorbit answered in the last two minutes, so `docker ps` shows a lost
    # uplink. The image has the same check; it's here so it can be tuned.
    healthcheck:
      test: ["CMD", "python", "-m", "floorbit_agent", "health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 2

volumes:
  agent_state:
