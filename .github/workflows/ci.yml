name: CI

# Lint and test on every pull request and on main. The jobs below find what the repo
# has (pyproject.toml, package.json) and skip what isn't there, so a new repo is green
# from the first commit. Replace them with the repo's own jobs as it grows, and keep
# "CI passed" last: it is the one check the main ruleset requires.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ref
        run: echo "floorbit=$(tr -d '[:space:]' < FLOORBIT_REF)" >> "$GITHUB_OUTPUT"
      # The agent reuses Floorbit's code (README, "How it relates to Floorbit"): the commit it's tested with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitsandbricks-ch/floorbit
          ref: ${{ steps.ref.outputs.floorbit }}
          path: floorbit-src
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - env:
          FLOORBIT_SRC: floorbit-src
        run: |
          pip install -r floorbit-src/requirements.txt -e ".[dev]"
          ruff check --exclude floorbit-src .
          pytest -q

  vrrp:
    # VRRP mode against the real keepalived: two agents in two network namespaces (docs/vrrp.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends keepalived
          sudo systemctl stop keepalived || true
          sudo "$(command -v python)" scripts/vrrp_check.py

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: has
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.has.outputs.node
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

  workflows:
    # The workflow files themselves: syntax, and expressions that would let a PR title
    # or branch name run as shell (actionlint with its shellcheck pass).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          pip install --quiet actionlint-py
          actionlint -color

  lab:
    # The hardware-free test lab (docs/lab/README.md): Floorbit, two agents, the lab LibreNMS and the
    # simulated switches, end to end; then agent A goes away and agent B has to carry on.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ref
        run: echo "floorbit=$(tr -d '[:space:]' < FLOORBIT_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitsandbricks-ch/floorbit
          ref: ${{ steps.ref.outputs.floorbit }}
          path: floorbit-src
      - name: Start the lab
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: docker compose -f lab/compose.yml up -d --build --wait --wait-timeout 600
      - name: End-to-end tests
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: docker compose -f lab/compose.yml run --rm e2e
      # Attendees and the crew in a real browser, from the runner: on the lab network it is
      # 172.31.10.1, a trusted proxy of the front door (setup.py), so it can stand in for any seat.
      - name: Browser tests (check-in, the note on phones, the seat walk)
        env:
          LAB_FLOORBIT_URL: http://172.31.10.2:5000
          LAB_FRONT_DOOR: http://172.31.10.31:8080
          LAB_SHOTS: ${{ runner.temp }}/lab-shots
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install -q "playwright==1.55.0" "pytest==8.4.2" "requests==2.32.5"
          "$RUNNER_TEMP/browser/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/browser/bin/python" -m pytest -q -p no:cacheprovider -rs lab/e2e/test_attendee_browser.py
      - name: No stack traces in the agents' logs
        run: |
          if docker compose -f lab/compose.yml logs --no-color agent-a agent-b | grep -B5 -A20 Traceback; then
            echo "::error::An agent logged a stack trace (above)."
            exit 1
          fi
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-browser-screenshots
          path: ${{ runner.temp }}/lab-shots
          if-no-files-found: ignore
      # Bad days (docs/lab/README.md, "Drills"): each part goes away, the crew's view is checked,
      # and it comes back.
      - name: "Drill: a firewall and an access switch die, then come back"
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: |
          docker compose -f lab/compose.yml stop fw-01 access-c1
          docker compose -f lab/compose.yml run --rm -e LAB_DRILL=devices-down e2e
          docker compose -f lab/compose.yml start fw-01 access-c1
          docker compose -f lab/compose.yml run --rm -e LAB_DRILL=recovered e2e
      - name: "Drill: LibreNMS is away"
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: |
          docker compose -f lab/compose.yml stop librenms
          docker compose -f lab/compose.yml run --rm -e LAB_DRILL=librenms-down e2e
          docker compose -f lab/compose.yml start librenms
      - name: "Drill: the hosted Floorbit is away, then back"
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: |
          from=$(date +%s)
          docker compose -f lab/compose.yml stop floorbit
          docker compose -f lab/compose.yml run --rm -e LAB_DRILL=hosted-down e2e
          docker compose -f lab/compose.yml up -d --wait floorbit
          docker compose -f lab/compose.yml run --rm -e LAB_DRILL=hosted-back -e "LAB_HOSTED_AWAY=$from-$(date +%s)" e2e
      - name: Failover (agent A stopped)
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: |
          docker compose -f lab/compose.yml stop agent-a
          docker compose -f lab/compose.yml run --rm -e LAB_AGENT_DOWN=agent-a e2e
      - name: Lab logs
        if: failure()
        env:
          LAB_FLOORBIT_SRC: ${{ github.workspace }}/floorbit-src
        run: docker compose -f lab/compose.yml logs --no-color --tail 300

  ci-passed:
    name: CI passed
    if: always()
    needs: [python, vrrp, node, workflows, lab]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
